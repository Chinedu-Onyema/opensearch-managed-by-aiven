# deploy busybox application logs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  labels:
    app: log-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-generator
  template:
    metadata:
      labels:
        app: log-generator
    spec:
      containers:
        - name: log-generator
          image: busybox                    # the busybox image we want to 
                                            # generate application logs from
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date) INFO: Application started";
                echo "$(date) DEBUG: Debugging app logic";
                echo "$(date) ERROR: An error occurred!";
                sleep 5;
              done
